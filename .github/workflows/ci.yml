name: CI

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'archive/**'          # prevent infinite loop from CI archive commits
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'manual trigger'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

# ── Job 1: Build & Test (matrix: .NET 8 / 9 / 10) ────────────────────────────
jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      # ── Step 1 ──────────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2 ──────────────────────────────────────────────────────────────
      - name: Setup .NET ${{ matrix.dotnet-version }} SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # ── Step 3 ──────────────────────────────────────────────────────────────
      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Report cache status
        run: |
          if [ "${{ steps.nuget-cache.outputs.cache-hit }}" == "true" ]; then
            echo "NuGet cache HIT — skipping download."
          else
            echo "NuGet cache MISS — packages will be downloaded."
          fi

      # ── Step 4 ──────────────────────────────────────────────────────────────
      - name: Restore dependencies
        run: |
          echo "Restoring NuGet packages ..."
          dotnet restore Converter.slnx
          echo "Restore complete."

      # ── Step 5 ──────────────────────────────────────────────────────────────
      - name: Build project
        run: |
          echo "Building solution in Debug configuration ..."
          dotnet build Converter.slnx --no-restore -c Debug
          echo "Build succeeded."

      # ── Step 6 ──────────────────────────────────────────────────────────────
      - name: Run tests and collect code coverage
        run: |
          echo "Running xUnit tests with XPlat Code Coverage collector ..."
          dotnet test Converter.slnx --no-build -c Debug \
            --settings coverlet.runsettings \
            --logger "trx;LogFileName=test-results-${{ matrix.dotnet-version }}.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"
          echo "Tests finished."

      # ── Step 7 ──────────────────────────────────────────────────────────────
      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/**/*.trx
          check_name: Test Results (.NET ${{ matrix.dotnet-version }})

      # ── Step 8 (only on .NET 8 leg) ─────────────────────────────────────────
      - name: Generate HTML coverage report
        if: matrix.dotnet-version == '8.0.x'
        uses: danielpalme/ReportGenerator-Github-Action@5.4.15
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline_AzurePipelines;Cobertura;TextSummary;MarkdownSummaryGithub
          verbosity: Info

      # ── Step 9 (only on .NET 8 leg) ─────────────────────────────────────────
      - name: Enforce minimum 60% branch coverage
        if: matrix.dotnet-version == '8.0.x'
        run: |
          echo "=== Coverage Summary ==="
          cat coveragereport/Summary.txt
          python3 - <<'PY'
          import re, sys
          text = open("coveragereport/Summary.txt").read()
          match = re.search(r"Branch coverage:\s*([\d.]+)%", text)
          if not match:
              print("ERROR: Could not parse branch coverage from Summary.txt")
              print("Hint: Check that coverlet.runsettings is present and produced coverage.cobertura.xml")
              sys.exit(1)
          value = float(match.group(1))
          print(f"Branch coverage: {value}%  (threshold: 60%)")
          if value < 60:
              print(f"FAIL: {value}% is below the required 60%.")
              print("Hint: Add tests for uncovered branches, then push again.")
              sys.exit(1)
          print(f"PASS: {value}% meets the required 60% threshold.")
          PY

      # ── Step 10 (only on .NET 8 leg) ────────────────────────────────────────
      - name: Upload coverage report artifact
        if: always() && matrix.dotnet-version == '8.0.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coveragereport/
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      # ── Step 11 ─────────────────────────────────────────────────────────────
      - name: Upload test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dotnet-version }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

  # ── Job 2: Publish single-file exe + smoke test ───────────────────────────
  publish-exe:
    name: Publish and smoke-test executable
    runs-on: windows-latest
    needs: build-test

    steps:
      # ── Step 1 ──────────────────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2 ──────────────────────────────────────────────────────────────
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ── Step 3 ──────────────────────────────────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── Step 4 ──────────────────────────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore Converter.slnx

      # ── Step 5 ──────────────────────────────────────────────────────────────
      - name: Publish single-file executable
        run: |
          echo "Publishing Converter as a single-file executable ..."
          dotnet publish Converter/Converter.csproj -c Release -p:DebugType=none -p:DebugSymbols=false
          echo "Publish complete."

      # ── Step 6 ──────────────────────────────────────────────────────────────
      - name: Smoke test published executable
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path Converter/bin/Release -Recurse -Directory -Filter publish | Select-Object -First 1
          if (-not $publishDir) {
            Write-Error "Publish directory not found. Did the publish step succeed?"
            exit 1
          }
          Write-Host "Publish directory: $($publishDir.FullName)"
          Copy-Item samples/sample.csv $publishDir.FullName
          Write-Host "Running: Converter.exe sample.csv json"
          & "$($publishDir.FullName)/Converter.exe" "$($publishDir.FullName)/sample.csv" json
          if (-not (Test-Path "$($publishDir.FullName)/sample.json")) {
            Write-Error "Smoke test FAILED: expected sample.json was not created next to the exe."
            exit 1
          }
          Write-Host "Smoke test PASSED: sample.json created successfully."

      # ── Step 7 ──────────────────────────────────────────────────────────────
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-exe
          path: Converter/bin/Release/**/publish/Converter.exe
          if-no-files-found: error

  # ── Job 3: Generate & save build report to archive/ ──────────────────────
  save-report:
    name: Save build report
    runs-on: ubuntu-latest
    needs: [build-test, publish-exe]
    if: always()                    # runs even when build-test or publish-exe failed
    permissions:
      contents: write               # needed to commit archive/ back to the repo

    steps:
      # ── Step 1 ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      # ── Step 2 ──────────────────────────────────────────────────────────────
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true     # coverage may not exist if build failed early
        with:
          name: coverage-report
          path: dl/coverage

      # ── Step 3 ──────────────────────────────────────────────────────────────
      - name: Download test results (.NET 8)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-8.0.x
          path: dl/trx/8.0.x

      # ── Step 4 ──────────────────────────────────────────────────────────────
      - name: Download test results (.NET 9)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-9.0.x
          path: dl/trx/9.0.x

      # ── Step 5 ──────────────────────────────────────────────────────────────
      - name: Download test results (.NET 10)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-10.0.x
          path: dl/trx/10.0.x

      # ── Step 6 ──────────────────────────────────────────────────────────────
      - name: Generate build report
        id: report
        env:
          BUILD_TEST_RESULT:  ${{ needs.build-test.result }}
          PUBLISH_EXE_RESULT: ${{ needs.publish-exe.result }}
          BRANCH:  ${{ github.head_ref || github.ref_name }}
          SHA:     ${{ github.sha }}
          RUN_ID:  ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO:    ${{ github.repository }}
        run: python3 .github/scripts/generate-report.py

      # ── Step 7 ──────────────────────────────────────────────────────────────
      - name: Commit report to archive/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          # Only commit if there is something new to commit
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ci: build report run #${{ github.run_number }} [skip ci]"
            git push
          fi
